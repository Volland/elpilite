schema: spec-driven

context: |
  Project: elpilite — a typed, bitemporal, neuro-symbolic database for agentic memory.
  Tech stack: OCaml 5.x, dune, ELPI 1.18 (λProlog) as DDL + query language,
  Turso Database (sqlite3-compatible C API) as primary store, stock SQLite + sqlite-vec
  as differential-testing backend, sqlite3-ocaml bindings, QCheck for property tests.
  Interfaces: OCaml library, CLI/REPL, MCP server, Python thin client, Node.js N-API addon.
  Architecture and design decisions live in lat.md/ (run `lat check` after changes).
  Principles: one language (λProlog); DB is source of truth; append-only bitemporal;
  pure reads + atomic delta writes; push relational work to SQL; mechanism not policy;
  every optimisation has a differential twin test.

